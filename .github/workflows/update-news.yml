name: Update News
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/fetch-news.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: news updated $(date +'%Y-%m-%d %H:%M')"
          git push
